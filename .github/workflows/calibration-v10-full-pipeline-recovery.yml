name: Calibration v10 — Full Pipeline Recovery

on:
  push:
    branches:
      - feature/calibration-v10-full-pipeline-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-pipeline-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Validate v10 harness
        run: |
          node --check scripts/generate-synthetic-calibration.js
          node --check scripts/run-psychometric-pipeline.js
          node --check scripts/run-full-pipeline-recovery.js
          node --check scripts/run-full-pipeline-stability.js
          node tests/full-pipeline-recovery-validation.js
          node tests/full-pipeline-stability-validation.js
          Rscript -e 'for (f in c("calibration/analysis/reliability.R","calibration/analysis/irt_mirt.R","calibration/analysis/age_dif.R","calibration/analysis/cfa_invariance.R","calibration/analysis/general_theta.R","calibration/analysis/norming.R","calibration/analysis/external_linking.R")) parse(file=f); cat("R parse PASS\n")'

      - name: Install full pipeline dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::psych
            any::mirt
            any::lavaan
            any::lordif
            any::readr
            any::dplyr
            any::tidyr
            any::jsonlite
          cache-version: 1

      - name: Run bounded full-pipeline recovery
        run: |
          node scripts/run-full-pipeline-recovery.js \
            --participants 900 \
            --seed cil-v10-ci \
            --out "$RUNNER_TEMP/cil-v10"

      - name: Validate aggregate v10 report
        run: |
          node - "$RUNNER_TEMP/cil-v10/full-pipeline-recovery-summary.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          function fail(message) {
            const text = String(message);
            console.error(`::error::${text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
            throw new Error(text);
          }
          if (report.status !== 'complete-diagnostic') fail(`Unexpected v10 status: ${report.status}`);
          if (report.configuration.participants !== 900) fail('Expected 900 bounded CI participants');
          if (report.configuration.seed !== 'cil-v10-ci') fail('Unexpected v10 seed');
          if (report.configuration.panel !== 'pipeline') fail('Expected clean pipeline panel');
          if (report.configuration.deterministicAnalysisSeed !== true) fail('Expected deterministic analysis seed');
          if (report.gates.allStructuralChecksPassed !== true) fail('Not all v10 structural checks passed');
          if (report.gates.scientificThresholdsPreRegistered !== false) fail('v10 must not invent post-hoc scientific pass thresholds');
          for (const key of ['productNormEligible','productIqUnlocked','autoCpiToIq']) {
            if (report.gates[key] !== false) fail(`${key} must remain false`);
          }
          if (report.safety.containsRealParticipants !== false || report.safety.syntheticOnly !== true) {
            fail('v10 artifact must remain synthetic-only');
          }
          if (Object.keys(report.recovery.reliability || {}).length !== 6) fail('Expected six reliability domains');
          if (report.recovery.cfaInvariance?.status !== 'ok') fail('Expected CFA/invariance diagnostics');
          if (!(report.recovery.generalTheta?.matchedParticipants >= 810)) fail('Expected general-theta recovery for >=90% of participants');
          if (report.recovery.norming?.ageBands !== 5) fail('Expected all five age bands');
          if (report.recovery.externalLinking?.linkedParticipants !== 900) fail('Expected all participants in synthetic external linking');
          console.log(JSON.stringify({
            status: report.status,
            generalThetaCorrelationWithTrueG: report.recovery.generalTheta.correlationWithTrueG,
            bandMeanRecoveryRmse: report.recovery.norming.bandMeanRecoveryRmse,
            cpiSlopeBias: report.recovery.externalLinking.cpiSlopeBias,
            cleanPanelDifFalsePositiveRate: report.recovery.cleanPanelDif.falsePositiveRate,
            productIqUnlocked: report.gates.productIqUnlocked
          }, null, 2));
          NODE

      - name: Verify deterministic replay
        run: |
          node scripts/run-full-pipeline-recovery.js \
            --participants 900 \
            --seed cil-v10-ci \
            --out "$RUNNER_TEMP/cil-v10-replay"
          node - "$RUNNER_TEMP/cil-v10/full-pipeline-recovery-summary.json" "$RUNNER_TEMP/cil-v10-replay/full-pipeline-recovery-summary.json" <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const a = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const b = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          function normalize(x) {
            const { generatedAt, ...rest } = x;
            return rest;
          }
          const at = JSON.stringify(normalize(a));
          const bt = JSON.stringify(normalize(b));
          const digest = x => crypto.createHash('sha256').update(x).digest('hex');
          if (at !== bt) throw new Error(`Deterministic v10 replay mismatch: ${digest(at)} != ${digest(bt)}`);
          console.log(JSON.stringify({ deterministicReplayMatched: true, sha256: digest(at) }, null, 2));
          NODE

      - name: Enforce aggregate-only artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cil-v10-public"
          cp "$RUNNER_TEMP/cil-v10/full-pipeline-recovery-summary.json" "$RUNNER_TEMP/cil-v10-public/"
          test "$(find "$RUNNER_TEMP/cil-v10-public" -type f | wc -l)" -eq 1
          ! grep -R -E 'sourceKey|sessionId|synthetic-[0-9]{6}|synthetic-session-[0-9]{6}|administrationId' "$RUNNER_TEMP/cil-v10-public"

      - name: Upload aggregate-only v10 result
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v10-full-pipeline-recovery-summary
          path: ${{ runner.temp }}/cil-v10-public/full-pipeline-recovery-summary.json
          retention-days: 30

  bounded-full-stability:
    needs: full-pipeline-recovery
    if: ${{ needs.full-pipeline-recovery.result == 'success' && github.event_name == 'push' && contains(github.event.head_commit.message, '[v10-full]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Validate multi-seed harness
        run: |
          node --check scripts/run-full-pipeline-stability.js
          node tests/full-pipeline-stability-validation.js

      - name: Install full pipeline dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::psych
            any::mirt
            any::lavaan
            any::lordif
            any::readr
            any::dplyr
            any::tidyr
            any::jsonlite
          cache-version: 1

      - name: Run pre-specified five-seed stability study
        run: |
          node scripts/run-full-pipeline-stability.js \
            --replicates 5 \
            --participants 1200 \
            --seed-prefix cil-v10-full-stability \
            --out "$RUNNER_TEMP/cil-v10-full"

      - name: Validate aggregate stability report
        run: |
          node - "$RUNNER_TEMP/cil-v10-full/full-pipeline-stability-summary.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          function fail(message) { throw new Error(String(message)); }
          if (report.status !== 'complete-diagnostic') fail(`Unexpected full-study status: ${report.status}`);
          if (report.configuration.replicates !== 5) fail('Expected five stability replicates');
          if (report.configuration.participantsPerReplicate !== 1200) fail('Expected 1200 participants per stability replicate');
          if (report.configuration.seedPrefix !== 'cil-v10-full-stability') fail('Unexpected stability seed prefix');
          if (report.configuration.developmentSeedExcluded !== true) fail('Development seed must be excluded');
          if (report.gates.allReplicatesStructurallyComplete !== true) fail('Not all stability replicates completed structurally');
          if (report.gates.scientificThresholdsPreRegistered !== false) fail('No post-hoc scientific threshold is permitted');
          for (const key of ['productNormEligible','productIqUnlocked','autoCpiToIq']) {
            if (report.gates[key] !== false) fail(`${key} must remain false`);
          }
          if (report.safety.containsRealParticipants !== false || report.safety.syntheticOnly !== true) fail('Full stability artifact must be synthetic-only');
          if (Object.keys(report.aggregate.reliability || {}).length !== 6) fail('Expected six reliability domains');
          console.log(JSON.stringify({
            status: report.status,
            reliability: report.aggregate.reliability,
            generalThetaCorrelationWithTrueG: report.aggregate.generalThetaCorrelationWithTrueG,
            normingBandMeanRecoveryRmse: report.aggregate.normingBandMeanRecoveryRmse,
            externalCpiSlopeBias: report.aggregate.externalCpiSlopeBias,
            cleanPanelDifFalsePositiveRate: report.aggregate.cleanPanelDifFalsePositiveRate,
            productIqUnlocked: report.gates.productIqUnlocked
          }, null, 2));
          NODE

      - name: Enforce aggregate-only stability artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cil-v10-full-public"
          cp "$RUNNER_TEMP/cil-v10-full/full-pipeline-stability-summary.json" "$RUNNER_TEMP/cil-v10-full-public/"
          test "$(find "$RUNNER_TEMP/cil-v10-full-public" -type f | wc -l)" -eq 1
          ! grep -R -E 'sourceKey|sessionId|synthetic-[0-9]{6}|synthetic-session-[0-9]{6}|administrationId' "$RUNNER_TEMP/cil-v10-full-public"

      - name: Upload aggregate-only stability result
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v10-full-pipeline-stability-summary
          path: ${{ runner.temp }}/cil-v10-full-public/full-pipeline-stability-summary.json
          retention-days: 30
