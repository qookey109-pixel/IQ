name: Calibration v11 — DIF Post-Failure Diagnostic

on:
  push:
    branches:
      - diagnostic/calibration-v11-dif-r01-post-failure
    paths:
      - 'scripts/run-v11-dif-postfailure-diagnostic.js'
      - 'tests/v11-dif-postfailure-diagnostic-validation.js'
      - '.github/workflows/calibration-v11-dif-postfailure-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-information-r01-dif-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate diagnostic harness and frozen scope
        run: |
          node --check scripts/run-v11-dif-postfailure-diagnostic.js
          node --check tests/v11-dif-postfailure-diagnostic-validation.js
          node tests/v11-dif-postfailure-diagnostic-validation.js
          node scripts/run-v11-dif-postfailure-diagnostic.js \
            --protocol calibration/confirmatory-reliability-v11.json \
            --out "$RUNNER_TEMP/cil-v11-dif-diagnostic" \
            --dry-run > "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"seed": "cil-v11-high-information-control-r01"' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"analysisSeed": 2147221403' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"frozenCleanDifThreshold": 0.1' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"changesConfirmatoryVerdict": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"thresholdChangesAllowed": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"productNormEligible": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"productIqUnlocked": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"autoCpiToIq": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install full pipeline dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::psych
            any::mirt
            any::lavaan
            any::lordif
            any::readr
            any::dplyr
            any::tidyr
            any::jsonlite
          cache-version: 1

      - name: Reproduce high-information r01 and diagnose DIF flags
        run: |
          node scripts/run-v11-dif-postfailure-diagnostic.js \
            --protocol calibration/confirmatory-reliability-v11.json \
            --out "$RUNNER_TEMP/cil-v11-dif-diagnostic"

      - name: Validate aggregate-only diagnostic result
        run: |
          node - "$RUNNER_TEMP/cil-v11-dif-diagnostic/v11-dif-postfailure-diagnostic.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          function fail(message) { throw new Error(String(message)); }
          if (!String(report.status).startsWith('post-failure-diagnostic-')) fail(`Unexpected status: ${report.status}`);
          if (report.scope?.conditionId !== 'high-information-control') fail('Wrong condition');
          if (report.scope?.replicate !== 1) fail('Wrong replicate');
          if (report.scope?.seed !== 'cil-v11-high-information-control-r01') fail('Seed drift');
          if (report.scope?.analysisSeed !== 2147221403) fail('Analysis seed drift');
          if (report.scope?.participants !== 1200) fail('Participant count drift');
          if (report.reproduction?.difRows !== 42) fail(`Expected 42 clean-panel DIF rows, got ${report.reproduction?.difRows}`);
          if (report.governance?.confirmatoryVerdictRemains !== 'failed-confirmatory') fail('Confirmatory verdict changed');
          if (report.governance?.changesConfirmatoryVerdict !== false) fail('Diagnostic must not change confirmatory verdict');
          if (report.governance?.thresholdChangesAllowed !== false) fail('Threshold rewrite is forbidden');
          for (const key of ['productNormEligible','productIqUnlocked','autoCpiToIq']) {
            if (report.governance?.[key] !== false) fail(`${key} must remain false`);
          }
          console.log(JSON.stringify({
            status: report.status,
            difRows: report.reproduction.difRows,
            difFlags: report.reproduction.difFlags,
            difFalsePositiveRate: report.reproduction.difFalsePositiveRate,
            cleanDifScreenPass: report.reproduction.cleanDifScreenPass,
            matchesSourceEvidence: report.reproduction.matchesSourceEvidence,
            flaggedByDomain: report.reproduction.flaggedByDomain,
            flaggedItems: report.reproduction.flaggedItems.map(x => ({
              itemId: x.itemId,
              domain: x.domain,
              difDeltaR2: x.difDeltaR2,
              correctRateSpread: x.correctRateRange?.spread
            })),
            confirmatoryVerdictRemains: report.governance.confirmatoryVerdictRemains,
            productIqUnlocked: report.governance.productIqUnlocked
          }, null, 2));
          NODE

      - name: Enforce aggregate-only artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cil-v11-dif-public"
          cp "$RUNNER_TEMP/cil-v11-dif-diagnostic/v11-dif-postfailure-diagnostic.json" "$RUNNER_TEMP/cil-v11-dif-public/"
          test "$(find "$RUNNER_TEMP/cil-v11-dif-public" -type f | wc -l)" -eq 1
          ! grep -R -E 'sourceKey|sessionId|synthetic-[0-9]{6}|synthetic-session-[0-9]{6}|administrationId' "$RUNNER_TEMP/cil-v11-dif-public"

      - name: Upload aggregate-only diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v11-dif-postfailure-diagnostic
          path: ${{ runner.temp }}/cil-v11-dif-public/v11-dif-postfailure-diagnostic.json
          retention-days: 30
