name: Calibration v11 — DIF Post-Failure Diagnostic

on:
  push:
    branches:
      - diagnostic/calibration-v11-dif-r01-post-failure
    paths:
      - 'calibration/analysis/v11_dif_effectsize_diagnostic.R'
      - 'scripts/run-v11-dif-postfailure-diagnostic.js'
      - 'scripts/run-v11-dif-effectsize-postfailure-diagnostic.js'
      - 'tests/v11-dif-postfailure-diagnostic-validation.js'
      - 'tests/v11-dif-effectsize-postfailure-diagnostic-validation.js'
      - '.github/workflows/calibration-v11-dif-postfailure-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-information-r01-dif-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate diagnostic harness and frozen scope
        run: |
          node --check scripts/run-v11-dif-postfailure-diagnostic.js
          node --check scripts/run-v11-dif-effectsize-postfailure-diagnostic.js
          node --check tests/v11-dif-postfailure-diagnostic-validation.js
          node --check tests/v11-dif-effectsize-postfailure-diagnostic-validation.js
          node tests/v11-dif-postfailure-diagnostic-validation.js
          node tests/v11-dif-effectsize-postfailure-diagnostic-validation.js
          node scripts/run-v11-dif-effectsize-postfailure-diagnostic.js \
            --protocol calibration/confirmatory-reliability-v11.json \
            --out "$RUNNER_TEMP/cil-v11-dif-diagnostic" \
            --dry-run > "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"targetSeed": "cil-v11-high-information-control-r01"' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"targetAnalysisSeed": 2147221403' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"referenceR2Change": 0.02' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"confirmatoryVerdictRemains": "failed-confirmatory"' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"changesConfirmatoryVerdict": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"thresholdChangesAllowed": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"productNormEligible": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"productIqUnlocked": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"
          grep -q '"autoCpiToIq": false' "$RUNNER_TEMP/cil-v11-dif-plan.json"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Validate R diagnostic syntax
        run: Rscript -e "parse(file='calibration/analysis/v11_dif_effectsize_diagnostic.R')"

      - name: Install full pipeline dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::psych
            any::mirt
            any::lavaan
            any::lordif
            any::readr
            any::dplyr
            any::tidyr
            any::jsonlite
          cache-version: 1

      - name: Reproduce high-information r01 and diagnose DIF effect sizes
        run: |
          node scripts/run-v11-dif-effectsize-postfailure-diagnostic.js \
            --protocol calibration/confirmatory-reliability-v11.json \
            --out "$RUNNER_TEMP/cil-v11-dif-diagnostic"

      - name: Validate aggregate-only diagnostic result
        run: |
          node - "$RUNNER_TEMP/cil-v11-dif-diagnostic/v11-dif-postfailure-effectsize-diagnostic.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          function fail(message) { throw new Error(String(message)); }
          if (report.status !== 'post-failure-effectsize-diagnostic-complete') fail(`Unexpected status: ${report.status}`);
          if (report.scope?.conditionId !== 'high-information-control') fail('Wrong condition');
          if (report.scope?.replicate !== 1) fail('Wrong replicate');
          if (report.scope?.seed !== 'cil-v11-high-information-control-r01') fail('Seed drift');
          if (report.scope?.analysisSeed !== 2147221403) fail('Analysis seed drift');
          if (report.scope?.participants !== 1200) fail('Participant count drift');
          if (report.reproduction?.difRows !== 42) fail(`Expected 42 clean-panel DIF rows, got ${report.reproduction?.difRows}`);
          if (report.reproduction?.difFlags !== 5) fail(`Expected 5 reproduced Chisqr flags, got ${report.reproduction?.difFlags}`);
          if (report.effectSizeAudit?.extractionComplete !== true) fail('lordif fit$stats extraction incomplete');
          if (report.effectSizeAudit?.analyzedItems !== 42) fail('Expected 42 effect-size rows');
          if (report.effectSizeAudit?.statisticalFlags !== 5) fail('Expected 5 statistical DIF flags');
          if (report.effectSizeAudit?.productionDifDeltaR2AvailableItems !== 0) fail('Production age-dif unexpectedly exposed a usable difDeltaR2');
          if (report.effectSizeAudit?.productionDifDeltaR2MissingItems !== 42) fail('Expected all production difDeltaR2 values to be missing');
          if (report.effectSizeAudit?.semantics?.sameMeaning !== false) fail('Statistical and material DIF semantics must remain distinct');
          if (report.governance?.confirmatoryVerdictRemains !== 'failed-confirmatory') fail('Confirmatory verdict changed');
          if (report.governance?.changesConfirmatoryVerdict !== false) fail('Diagnostic must not change confirmatory verdict');
          if (report.governance?.thresholdChangesAllowed !== false) fail('Threshold rewrite is forbidden');
          for (const key of ['productNormEligible','productIqUnlocked','autoCpiToIq']) {
            if (report.governance?.[key] !== false) fail(`${key} must remain false`);
          }
          console.log(JSON.stringify({
            status: report.status,
            statisticalFlags: report.effectSizeAudit.statisticalFlags,
            statisticalFlagRate: report.effectSizeAudit.statisticalFlagRate,
            materialByMcFaddenR2: report.effectSizeAudit.materialByMcFaddenR2,
            materialByMcFaddenR2Rate: report.effectSizeAudit.materialByMcFaddenR2Rate,
            productionDifDeltaR2AvailableItems: report.effectSizeAudit.productionDifDeltaR2AvailableItems,
            materialItems: report.effectSizeAudit.materialItems,
            flaggedItems: report.reproduction.flaggedItems.map(x => ({
              itemId: x.itemId,
              domain: x.domain,
              productionDifDeltaR2: x.productionDifDeltaR2,
              chi12P: x.lordifStats?.chi12P,
              chi13P: x.lordifStats?.chi13P,
              chi23P: x.lordifStats?.chi23P,
              pseudo13McFadden: x.lordifStats?.pseudo13McFadden,
              materialByMcFaddenR2: x.lordifStats?.materialByMcFaddenR2,
              correctRateSpread: x.correctRateRange?.spread
            })),
            confirmatoryVerdictRemains: report.governance.confirmatoryVerdictRemains,
            productIqUnlocked: report.governance.productIqUnlocked
          }, null, 2));
          NODE

      - name: Enforce aggregate-only artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cil-v11-dif-public"
          cp "$RUNNER_TEMP/cil-v11-dif-diagnostic/v11-dif-postfailure-effectsize-diagnostic.json" "$RUNNER_TEMP/cil-v11-dif-public/"
          test "$(find "$RUNNER_TEMP/cil-v11-dif-public" -type f | wc -l)" -eq 1
          ! grep -R -E 'sourceKey|sessionId|synthetic-[0-9]{6}|synthetic-session-[0-9]{6}|administrationId' "$RUNNER_TEMP/cil-v11-dif-public"

      - name: Upload aggregate-only diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v11-dif-postfailure-effectsize-diagnostic
          path: ${{ runner.temp }}/cil-v11-dif-public/v11-dif-postfailure-effectsize-diagnostic.json
          retention-days: 30
