name: Calibration v12 — Confirmatory Result Validation

on:
  pull_request:
    paths:
      - 'calibration/v12-confirmatory-result.json'
      - 'calibration/v12-confirmatory-execution-authority.executed.json'
      - 'calibration/V12_CONFIRMATORY_RESULT.md'
      - 'tests/calibration-v12-confirmatory-result-validation.js'
      - '.github/workflows/calibration-v12-confirmatory-result.yml'
  push:
    branches:
      - research/calibration-v12-confirmatory-execution-20260918

jobs:
  validate-confirmatory-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frozen aggregate result and consumed authority
        run: |
          node --check tests/calibration-v12-confirmatory-result-validation.js
          node tests/calibration-v12-confirmatory-result-validation.js

      - name: Prove active execution authority is gone
        run: |
          test ! -e calibration/v12-confirmatory-execution-authority.json
