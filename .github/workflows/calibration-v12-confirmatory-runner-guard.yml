name: Calibration v12 — Confirmatory Runner Guard

on:
  pull_request:
    paths:
      - 'calibration/**'
      - 'scripts/run-v12-confirmatory.js'
      - 'scripts/generate-synthetic-calibration.js'
      - 'tests/calibration-v12-confirmatory-runner-guard-validation.js'
      - '.github/workflows/calibration-v12-confirmatory-runner-guard.yml'
  push:
    branches:
      - main
      - research/calibration-v12-confirmatory-runner-guard-20260918
    paths:
      - 'calibration/**'
      - 'scripts/run-v12-confirmatory.js'
      - 'scripts/generate-synthetic-calibration.js'
      - 'tests/calibration-v12-confirmatory-runner-guard-validation.js'
      - '.github/workflows/calibration-v12-confirmatory-runner-guard.yml'

jobs:
  validate-confirmatory-runner-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate runner syntax and execution guard
        run: |
          node --check scripts/run-v12-confirmatory.js
          node --check tests/calibration-v12-confirmatory-runner-guard-validation.js
          node tests/calibration-v12-confirmatory-runner-guard-validation.js

      - name: Validate dry-run plan only
        run: |
          node scripts/run-v12-confirmatory.js --dry-run --out "$RUNNER_TEMP/v12-confirmatory-dry" > "$RUNNER_TEMP/v12-confirmatory-plan.json"
          grep -q '"totalReplicates": 10' "$RUNNER_TEMP/v12-confirmatory-plan.json"
          grep -q '"executionAuthorized": false' "$RUNNER_TEMP/v12-confirmatory-plan.json"
          grep -q '"confirmatorySeedsConsumed": false' "$RUNNER_TEMP/v12-confirmatory-plan.json"
          grep -q '"productIqUnlocked": false' "$RUNNER_TEMP/v12-confirmatory-plan.json"
          test ! -e "$RUNNER_TEMP/v12-confirmatory-dry"

      - name: Prove execution remains locked before data creation
        run: |
          if node scripts/run-v12-confirmatory.js --out "$RUNNER_TEMP/forbidden-confirmatory"; then
            echo "confirmatory execution unexpectedly succeeded without authority" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/forbidden-confirmatory"

      - name: Set up R for syntax parsing only
        uses: r-lib/actions/setup-r@v2

      - name: Parse selected-method confirmatory analysis without execution
        run: |
          Rscript -e 'parse(file="calibration/analysis/v12_dif_confirmatory_selected.R"); cat("Parsed confirmatory selected-method analysis\n")'
