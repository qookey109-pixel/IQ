name: Calibration v13 — Taiwan Recruitment Consent Plan

on:
  pull_request:
    paths:
      - 'calibration/V13_TAIWAN_RECRUITMENT_CONSENT_PLAN.md'
      - 'calibration/V13_TAIWAN_PARTICIPANT_CONSENT_ZH_HANT_TW.md'
      - 'calibration/v13-taiwan-recruitment-consent-plan.json'
      - 'tests/calibration-v13-taiwan-recruitment-consent-validation.js'
      - '.github/workflows/calibration-v13-taiwan-recruitment-consent.yml'
  push:
    branches:
      - research/calibration-v13-taiwan-recruitment-consent-plan-20260918

permissions:
  contents: read

jobs:
  validate-taiwan-recruitment-consent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate recruitment and consent plan
        run: |
          node --check tests/calibration-v13-taiwan-recruitment-consent-validation.js
          node tests/calibration-v13-taiwan-recruitment-consent-validation.js

      - name: Prove no recruitment or collection activation
        run: |
          node - <<'NODE'
          const p = require('./calibration/v13-taiwan-recruitment-consent-plan.json');
          if (p.ethicsGate.determinationStatus !== 'unset') process.exit(1);
          if (p.schemaActivationBoundary.schemaActivationAuthorized !== false) process.exit(1);
          if (p.executionLock.recruitmentLaunchAuthorized !== false) process.exit(1);
          if (p.executionLock.consentPageActivationAuthorized !== false) process.exit(1);
          if (p.executionLock.realParticipantCollectionAuthorized !== false) process.exit(1);
          if (p.executionLock.participantDataAccessAuthorized !== false) process.exit(1);
          if (p.executionLock.executionWorkflowIncluded !== false) process.exit(1);
          if (p.governance.productIqUnlocked !== false) process.exit(1);
          console.log('v13 Taiwan recruitment/consent lock PASS');
          NODE
