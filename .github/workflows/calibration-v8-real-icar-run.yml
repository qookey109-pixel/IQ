name: Calibration v8 — Real ICAR Run

on:
  push:
    branches:
      - feature/calibration-v8-first-real-icar-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-icar-sapa-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CIL_ICAR_IRT_MAX_N: '12000'
      CIL_ICAR_FACTOR_MAX_N: '18000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Validate adapters and parse R scripts
        run: |
          node --check scripts/normalize-icar-sapa.js
          node --check scripts/run-external-dataset-research-pack.js
          node tests/external-dataset-research-pack-validation.js
          node tests/real-icar-run-validation.js
          Rscript -e 'parse(file="scripts/acquire-icar-sapa.R"); parse(file="calibration/analysis/external_icar_validation.R"); cat("R parse PASS\n")'

      - name: Acquire public CC0 ICAR/SAPA data into runner temp only
        run: |
          mkdir -p "$RUNNER_TEMP/icar"
          Rscript scripts/acquire-icar-sapa.R "$RUNNER_TEMP/icar/icar-sapa-source.csv"
          test -s "$RUNNER_TEMP/icar/icar-sapa-source.csv"
          test ! -f calibration/input/external/icar-sapa.csv

      - name: Inspect staged ICAR aggregate encoding
        run: |
          Rscript - "$RUNNER_TEMP/icar/icar-sapa-source.csv" "$RUNNER_TEMP/icar/icar-encoding-diagnostics.txt" <<'RS'
          args <- commandArgs(trailingOnly = TRUE)
          frame <- read.csv(args[[1]], check.names = FALSE, stringsAsFactors = FALSE)
          item_pattern <- '^(LN|MR|VR|R3D)[._-]?[0-9]+$'
          item_cols <- names(frame)[grepl(item_pattern, names(frame), ignore.case = TRUE)]
          age_cols <- names(frame)[tolower(trimws(names(frame))) == 'age']
          if (length(item_cols) != 60) stop(sprintf('Expected 60 staged ICAR columns; got %d.', length(item_cols)))
          if (!length(age_cols)) stop('Staged ICAR source is missing age.')
          age_raw <- as.character(frame[[age_cols[[1]]]])
          age <- suppressWarnings(as.numeric(age_raw))
          valid_age <- is.finite(age) & age >= 18 & age <= 65
          age_tokens <- sort(unique(age_raw[!is.na(age_raw) & nzchar(age_raw)]))
          age_token_count <- length(age_tokens)
          if (length(age_tokens) > 40) age_tokens <- c(head(age_tokens, 20), '...', tail(age_tokens, 20))
          finite_age <- age[is.finite(age)]
          age_numeric_range <- if (length(finite_age)) sprintf('%s..%s', min(finite_age), max(finite_age)) else 'none'
          tokens <- sort(unique(unlist(lapply(frame[item_cols], function(x) as.character(x[!is.na(x) & nzchar(as.character(x))])))))
          if (length(tokens) > 20) tokens <- c(head(tokens, 20), '...')
          diagnostics <- c(
            sprintf('sourceRows=%d', nrow(frame)),
            sprintf('adultAgeRows=%d', sum(valid_age)),
            sprintf('itemColumns=%d', length(item_cols)),
            sprintf('scoredTokens=%s', paste(tokens, collapse='|')),
            sprintf('ageTokenCount=%d', age_token_count),
            sprintf('ageTokens=%s', paste(age_tokens, collapse='|')),
            sprintf('numericAgeFinite=%d', length(finite_age)),
            sprintf('numericAgeRange=%s', age_numeric_range)
          )
          cat(paste(sprintf('ICAR_ENCODING %s', diagnostics), collapse='\n'), '\n')
          writeLines(diagnostics, args[[2]], useBytes = TRUE)
          RS

      - name: Upload aggregate-only encoding diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v8-icar-encoding-diagnostics
          path: ${{ runner.temp }}/icar/icar-encoding-diagnostics.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preflight real ICAR normalization
        run: |
          PREFLIGHT_DIR="$RUNNER_TEMP/icar/preflight-normalize"
          rm -rf "$PREFLIGHT_DIR"
          node scripts/normalize-icar-sapa.js \
            "$RUNNER_TEMP/icar/icar-sapa-source.csv" \
            "$PREFLIGHT_DIR"
          test -s "$PREFLIGHT_DIR/external-scored-responses.csv"
          node - "$PREFLIGHT_DIR/external-dataset-manifest.json" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.itemColumns !== 60) throw new Error(`Expected 60 ICAR items; got ${manifest.itemColumns}`);
          if (manifest.participantsWithScoredResponses < 500) throw new Error('Too few scored ICAR participants for real validation.');
          if (manifest.scoredRows < 500) throw new Error('Too few scored ICAR rows for real validation.');
          if (manifest.productNormEligible !== false || manifest.productIqUnlocked !== false) {
            throw new Error('External-data governance lock changed during normalization.');
          }
          console.log(JSON.stringify({
            itemColumns: manifest.itemColumns,
            participantsWithScoredResponses: manifest.participantsWithScoredResponses,
            scoredRows: manifest.scoredRows,
            productNormEligible: manifest.productNormEligible,
            productIqUnlocked: manifest.productIqUnlocked
          }));
          NODE
          rm -rf "$PREFLIGHT_DIR"

      - name: Install bounded real-run R dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
          Rscript -e 'install.packages(c("psych","mirt","jsonlite"), repos="https://cloud.r-project.org", Ncpus=2)'
          Rscript -e 'required <- c("psych","mirt","jsonlite"); missing <- required[!vapply(required, requireNamespace, quietly=TRUE, FUN.VALUE=logical(1))]; if (length(missing)) stop(sprintf("Missing required R packages after install: %s", paste(missing, collapse=", "))); cat("R dependency gate PASS\n")'

      - name: Run real external research pack
        run: |
          node scripts/run-external-dataset-research-pack.js \
            --input "$RUNNER_TEMP/icar/icar-sapa-source.csv" \
            --out "$RUNNER_TEMP/icar/analysis" \
            --run-r

      - name: Build aggregate-only research artifact
        run: |
          mkdir -p "$RUNNER_TEMP/icar/public-results"
          for file in \
            external-dataset-manifest.json \
            external-research-pack-manifest.json \
            icar-external-validation.json \
            icar-item-parameters.csv \
            icar-age-dif-screen.csv \
            icar-age-band-summary.csv \
            icar-factor-loadings.csv
          do
            test -f "$RUNNER_TEMP/icar/analysis/$file"
            cp "$RUNNER_TEMP/icar/analysis/$file" "$RUNNER_TEMP/icar/public-results/$file"
          done
          test ! -f "$RUNNER_TEMP/icar/public-results/external-scored-responses.csv"
          if grep -R -E 'icar-[0-9a-f]{20}' "$RUNNER_TEMP/icar/public-results"; then
            echo 'Participant-level pseudonymous keys leaked into aggregate artifact.' >&2
            exit 1
          fi

      - name: Print compact real-run summary
        run: |
          node - "$RUNNER_TEMP/icar/public-results/icar-external-validation.json" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const summary = {
            version: manifest.version,
            datasetId: manifest.datasetId,
            participants: manifest.participants,
            scoredRows: manifest.scoredRows,
            items: manifest.items,
            ageRange: manifest.ageRange,
            analysisCaps: manifest.analysisCaps,
            reliability: manifest.reliability,
            ageDifScreen: manifest.ageDifScreen,
            factorStructure: manifest.factorStructure,
            safety: manifest.safety
          };
          console.log('CIL_REAL_ICAR_SUMMARY_START');
          console.log(JSON.stringify(summary, null, 2));
          console.log('CIL_REAL_ICAR_SUMMARY_END');
          NODE

      - name: Upload aggregate-only ICAR research results
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v8-real-icar-aggregate-results
          path: ${{ runner.temp }}/icar/public-results
          if-no-files-found: error
          retention-days: 30
