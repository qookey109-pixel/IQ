name: Calibration v9 — Monte Carlo Recovery

on:
  push:
    branches:
      - feature/calibration-v9-monte-carlo-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Validate v9 harness
        run: |
          node --check scripts/generate-synthetic-calibration.js
          node --check scripts/run-monte-carlo-recovery.js
          node tests/monte-carlo-recovery-validation.js
          Rscript -e 'parse(file="calibration/analysis/irt_mirt.R"); parse(file="calibration/analysis/age_dif.R"); cat("R parse PASS\n")'

      - name: Install bounded recovery dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::mirt
            any::lordif
            any::readr
            any::dplyr
            any::tidyr
            any::jsonlite
          cache-version: 1

      - name: Run bounded two-seed recovery study
        run: |
          node scripts/run-monte-carlo-recovery.js \
            --replicates 2 \
            --participants 900 \
            --seed-prefix cil-mc-v9-ci \
            --out "$RUNNER_TEMP/cil-mc-v9"

      - name: Validate aggregate recovery report
        run: |
          node - "$RUNNER_TEMP/cil-mc-v9/monte-carlo-recovery-summary.json" "$RUNNER_TEMP/cil-mc-v9/aggregate-safe-diagnostic.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          function fail(message) {
            const text = String(message);
            const annotation = text
              .replace(/%/g, '%25')
              .replace(/\r/g, '%0D')
              .replace(/\n/g, '%0A');
            console.error(`::error::${annotation}`);
            throw new Error(text);
          }
          const diagnostic = {
            status: report.status,
            configuration: {
              replicates: report.configuration?.replicates,
              participantsPerReplicate: report.configuration?.participantsPerReplicate
            },
            gates: {
              allReplicatesProducedFiniteRecoveryMetrics: report.gates?.allReplicatesProducedFiniteRecoveryMetrics,
              scientificThresholdsPreRegistered: report.gates?.scientificThresholdsPreRegistered,
              productNormEligible: report.gates?.productNormEligible,
              productIqUnlocked: report.gates?.productIqUnlocked,
              autoCpiToIq: report.gates?.autoCpiToIq
            },
            safety: {
              containsRealParticipants: report.safety?.containsRealParticipants,
              syntheticOnly: report.safety?.syntheticOnly
            },
            replicates: report.replicates?.map(rep => ({
              replicate: rep.replicate,
              seed: rep.seed,
              parameterRows: rep.parameterRows,
              matchedParameterRows: rep.matchedParameterRows,
              regularParameterRows: rep.regularParameterRows,
              discriminationCorrelation: rep.discriminationCorrelation,
              difficultyCorrelation: rep.difficultyCorrelation,
              discriminationRmse: rep.discriminationRmse,
              difficultyRmse: rep.difficultyRmse,
              lowDiscriminationControlsObserved: rep.lowDiscriminationControlsObserved,
              lowDiscriminationControlsBelow035: rep.lowDiscriminationControlsBelow035,
              negativeDiscriminationControlsObserved: rep.negativeDiscriminationControlsObserved,
              negativeDiscriminationControlsEstimatedNegative: rep.negativeDiscriminationControlsEstimatedNegative,
              difRows: rep.difRows,
              knownDifControlsObserved: rep.knownDifControlsObserved,
              knownDifControlsDetected: rep.knownDifControlsDetected,
              nullDifItemsObserved: rep.nullDifItemsObserved,
              nullDifItemsFlagged: rep.nullDifItemsFlagged,
              difSensitivity: rep.difSensitivity,
              difFalsePositiveRate: rep.difFalsePositiveRate
            })),
            aggregate: {
              discriminationCorrelation: report.aggregate?.discriminationCorrelation,
              difficultyCorrelation: report.aggregate?.difficultyCorrelation,
              discriminationRmse: report.aggregate?.discriminationRmse,
              difficultyRmse: report.aggregate?.difficultyRmse,
              difSensitivity: report.aggregate?.difSensitivity,
              difFalsePositiveRate: report.aggregate?.difFalsePositiveRate,
              knownDifControlsObserved: report.aggregate?.knownDifControlsObserved,
              knownDifControlsDetected: report.aggregate?.knownDifControlsDetected,
              nullDifItemsObserved: report.aggregate?.nullDifItemsObserved,
              nullDifItemsFlagged: report.aggregate?.nullDifItemsFlagged
            }
          };
          fs.writeFileSync(process.argv[3], JSON.stringify(diagnostic, null, 2) + '\n');
          console.log(JSON.stringify({ diagnostic }, null, 2));
          if (report.status !== 'complete-diagnostic') fail(`Unexpected report status: ${report.status}`);
          if (report.configuration.replicates !== 2) fail('Expected exactly two bounded CI replicates');
          if (!report.gates.allReplicatesProducedFiniteRecoveryMetrics) fail('Recovery metrics were not finite for every replicate');
          if (report.gates.scientificThresholdsPreRegistered !== false) fail('v9 must not invent post-hoc scientific pass thresholds');
          for (const key of ['productNormEligible','productIqUnlocked','autoCpiToIq']) {
            if (report.gates[key] !== false) fail(`${key} must remain false`);
          }
          if (report.safety.containsRealParticipants !== false || report.safety.syntheticOnly !== true) {
            fail('Monte Carlo artifact must remain synthetic-only');
          }
          if (!report.replicates.every(rep => rep.matchedParameterRows > 0 && rep.difRows > 0)) {
            fail('Each replicate must produce IRT and DIF diagnostics');
          }
          console.log(JSON.stringify({
            status: report.status,
            discriminationCorrelation: report.aggregate.discriminationCorrelation,
            difficultyCorrelation: report.aggregate.difficultyCorrelation,
            difSensitivity: report.aggregate.difSensitivity,
            difFalsePositiveRate: report.aggregate.difFalsePositiveRate,
            productIqUnlocked: report.gates.productIqUnlocked
          }, null, 2));
          NODE

      - name: Upload aggregate-safe failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v9-aggregate-safe-failure-diagnostic
          path: ${{ runner.temp }}/cil-mc-v9/aggregate-safe-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce aggregate-only artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cil-mc-v9-public"
          cp "$RUNNER_TEMP/cil-mc-v9/monte-carlo-recovery-summary.json" "$RUNNER_TEMP/cil-mc-v9-public/"
          test "$(find "$RUNNER_TEMP/cil-mc-v9-public" -type f | wc -l)" -eq 1
          ! grep -R -E 'synthetic-[0-9]{6}|synthetic-session-[0-9]{6}|sourceKey|sessionId' "$RUNNER_TEMP/cil-mc-v9-public"

      - name: Upload aggregate-only recovery result
        uses: actions/upload-artifact@v4
        with:
          name: calibration-v9-monte-carlo-recovery-summary
          path: ${{ runner.temp }}/cil-mc-v9-public/monte-carlo-recovery-summary.json
          retention-days: 30
