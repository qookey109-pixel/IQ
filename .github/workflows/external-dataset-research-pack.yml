name: External Dataset Research Pack

on:
  pull_request:
    paths:
      - 'calibration/**'
      - 'scripts/normalize-icar-sapa.js'
      - 'scripts/run-external-dataset-research-pack.js'
      - 'tests/external-dataset-research-pack-validation.js'
      - '.gitignore'
      - '.github/workflows/external-dataset-research-pack.yml'
  push:
    branches:
      - main
      - feature/cognitive-iq-lab-v6
      - feature/calibration-v7-external-dataset-research-pack
    paths:
      - 'calibration/**'
      - 'scripts/normalize-icar-sapa.js'
      - 'scripts/run-external-dataset-research-pack.js'
      - 'tests/external-dataset-research-pack-validation.js'
      - '.gitignore'
      - '.github/workflows/external-dataset-research-pack.yml'

jobs:
  validate-external-dataset-research-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Node syntax
        run: |
          node --check scripts/normalize-icar-sapa.js
          node --check scripts/run-external-dataset-research-pack.js
          node --check tests/external-dataset-research-pack-validation.js

      - name: Validate ICAR adapter, catalog isolation and IQ lock
        run: node tests/external-dataset-research-pack-validation.js

      - name: Validate dry-run execution plan
        run: |
          node scripts/run-external-dataset-research-pack.js \
            --dry-run \
            --input calibration/input/external/icar-sapa.csv \
            --out calibration/output/external-research-v7/icar-sapa \
            --run-r > /tmp/external-pack-plan.json
          grep -q '"networkFetch": false' /tmp/external-pack-plan.json
          grep -q '"participantBackend": false' /tmp/external-pack-plan.json
          grep -q '"productNormEligible": false' /tmp/external-pack-plan.json
          grep -q '"productIqUnlocked": false' /tmp/external-pack-plan.json
          grep -q '"external-icar-validation"' /tmp/external-pack-plan.json

      - name: Set up R for syntax parsing
        uses: r-lib/actions/setup-r@v2

      - name: Parse external validation R script without running heavy analysis
        run: Rscript -e 'parse(file="calibration/analysis/external_icar_validation.R"); cat("Parsed external_icar_validation.R\n")'

      - name: Confirm repository does not contain external raw dataset
        run: |
          test ! -f calibration/input/external/icar-sapa.csv
          grep -q '^calibration/output/$' .gitignore
