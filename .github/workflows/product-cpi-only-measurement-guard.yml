name: Product — Qualitative Result Guard

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'assessment-quality.js'
      - 'result-title-engine.js'
      - 'pretest-flow.js'
      - 'single-screen.css'
      - 'timeout-lock.js'
      - 'scoring-v2.js'
      - 'README.md'
      - 'PRODUCT_STATUS.md'
      - 'tests/cpi-only-runtime-validation.js'
      - 'tests/result-experience-validation.js'
      - 'tests/result-title-engine-validation.js'
      - '.github/workflows/product-cpi-only-measurement-guard.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'assessment-quality.js'
      - 'result-title-engine.js'
      - 'pretest-flow.js'
      - 'single-screen.css'
      - 'timeout-lock.js'
      - 'scoring-v2.js'
      - 'README.md'
      - 'PRODUCT_STATUS.md'
      - 'tests/cpi-only-runtime-validation.js'
      - 'tests/result-experience-validation.js'
      - 'tests/result-title-engine-validation.js'
      - '.github/workflows/product-cpi-only-measurement-guard.yml'

permissions:
  contents: read

jobs:
  validate-cpi-only-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate qualitative public-result boundary
        run: |
          node --check app.js
          node --check assessment-quality.js
          node --check result-title-engine.js
          node --check pretest-flow.js
          node --check timeout-lock.js
          node --check tests/cpi-only-runtime-validation.js
          node --check tests/result-experience-validation.js
          node --check tests/result-title-engine-validation.js
          node tests/cpi-only-runtime-validation.js
          node tests/pretest-flow-validation.js
          node tests/single-screen-validation.js
          node tests/result-experience-validation.js
          node tests/result-title-engine-validation.js
          node tests/scoring-v2-validation.js
