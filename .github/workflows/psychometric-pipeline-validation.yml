name: Psychometric Pipeline Validation

on:
  pull_request:
  push:
    branches:
      - main
      - feature/cognitive-iq-lab-v6
      - feature/calibration-v5-psychometric-pipeline

jobs:
  validate-psychometric-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Node pipeline syntax
        run: |
          node --check scripts/run-psychometric-pipeline.js
          node --check scripts/build-psychometric-readiness-report.js
          node --check tests/psychometric-pipeline-validation.js

      - name: Validate orchestration, report synthesis, item review and IQ lock
        run: node tests/psychometric-pipeline-validation.js

      - name: Validate dry-run execution plan
        run: |
          node scripts/run-psychometric-pipeline.js \
            --dry-run \
            --input calibration/output/pooled-study/pooled-independent-responses.csv \
            --out calibration/output/psychometric-v5 > /tmp/psychometric-plan.json
          grep -q '"productIqUnlocked": false' /tmp/psychometric-plan.json
          grep -q '"general-theta"' /tmp/psychometric-plan.json
          grep -q '"readiness-report"' /tmp/psychometric-plan.json

      - name: Set up R for syntax parsing
        uses: r-lib/actions/setup-r@v2

      - name: Parse psychometric R scripts without running analyses
        run: |
          Rscript -e 'files <- c(
            "calibration/analysis/common.R",
            "calibration/analysis/reliability.R",
            "calibration/analysis/irt_mirt.R",
            "calibration/analysis/age_dif.R",
            "calibration/analysis/cfa_invariance.R",
            "calibration/analysis/general_theta.R",
            "calibration/analysis/norming.R",
            "calibration/analysis/external_linking.R"
          ); for (f in files) { parse(file=f); cat("Parsed", f, "\n") }'
