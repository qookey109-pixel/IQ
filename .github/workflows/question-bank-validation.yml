name: Question Bank Validation

on:
  pull_request:
  push:
    branches:
      - main
      - feature/cognitive-iq-lab-v6

jobs:
  validate-question-bank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check question-bank.js
          node --check answer-quality.js
          node --check answer-position-balance.js
          node --check memory-answer-quality.js
          node --check presentation-clarity.js
          node --check assessment-quality.js
          node --check item-analytics.js
          node --check item-quality-v2.js
          node --check single-screen.js
          node --check navigation-layout-fix.js
          node --check app.js
          node --check timeout-lock.js
          node --check memory-exposure.js

      - name: Validate 300-item bank
        run: node tests/question-bank-validation.js

      - name: Validate research-informed option quality
        run: node tests/option-quality-validation.js

      - name: Validate harder working-memory choices
        run: node tests/memory-answer-quality-validation.js

      - name: Validate Item Quality QA v2 metrics
        run: node tests/item-quality-v2-validation.js

      - name: Validate low-fatigue presentation
        run: node tests/presentation-clarity-validation.js

      - name: Validate adaptive memory exposure
        run: node tests/memory-exposure-validation.js

      - name: Validate local item analytics
        run: node tests/item-analytics-validation.js

      - name: Validate single-screen experience
        run: node tests/single-screen-validation.js

      - name: Validate matrix viewport safety
        run: node tests/matrix-layout-validation.js

      - name: Validate forward navigation and dense matrix containment
        run: node tests/navigation-layout-validation.js
